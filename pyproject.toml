[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "platformer"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "pygame-ce==2.5.6"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "entities*", "ui*", "world*"]
exclude = ["experiments*"]
