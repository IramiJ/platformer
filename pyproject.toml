[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sparkbound"
version = "1.0.0"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "pygame-ce==2.5.6"
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.1"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "entities*", "ui*", "world*"]
exclude = ["experiments*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = ["experiments"]

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.format]
