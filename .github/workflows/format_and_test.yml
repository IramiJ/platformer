name: Formatting and Testing

on:
    pull_request:
        branches:
            - main

jobs:
    test:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: ./
        strategy:
            matrix:
                python-version: [3.12]
        env:
            MODE: "dev"
        
        steps:
            - uses: actions/checkout@v3

            - name: Set up Python
              uses: actions/setup-python@v4
              with: 
                  python-version: ${{matrix.python-version }}
            
            - name: Install dependencies
              run: |
                python -m pip install --upgrade pip
                pip install -e ".[dev]"

            - name: Check formatting
              run: |
                ruff check .
                ruff format --check .
            
            - name: Test app code
              run: python -m pytest
            